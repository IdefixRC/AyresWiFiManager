<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="success_title">Credentials saved</title>
  <style>
    :root{
      --bg:#0b1220; --card:#121a2b; --ring:#17223a; --muted:#9fb0cf; --text:#e6efff;
      --accent:#4cc9f0; --accent2:#4361ee;
      --r:14px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{
      margin:0; display:flex; align-items:center; justify-content:center; height:100vh;
      background:var(--bg); color:var(--text);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .card{
      background:var(--card); border:1px solid var(--ring); border-radius:var(--r);
      padding:24px; max-width:520px; width:92%; text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,.35);
    }
    .icon{
      width:88px; height:88px; margin:0 auto 12px;
    }
    h1{margin:.2rem 0 .4rem 0; font-size:20px}
    .muted{color:var(--muted); margin:.2rem 0 .4rem 0}
    .small{font-size:12px; color:#a8b7d6}

    /* Animaciones */
    .icon svg{ display:block; width:100%; height:100%; animation:pop .35s ease-out both; }
    /* Pulso del aro */
    .icon svg .pulse{
      transform-origin:50% 50%;
      animation:pulse 2.2s ease-out infinite;
      opacity:.35;
    }
    /* Sombra de “respiración” al fondo del disco */
    .icon svg .disc{
      filter: drop-shadow(0 4px 10px rgba(67,97,238,.25));
    }

    @keyframes pop{
      from{ transform:scale(.92); opacity:0 }
      to  { transform:scale(1);   opacity:1 }
    }
    @keyframes pulse{
      0%  { transform:scale(1);    opacity:.35 }
      70% { transform:scale(1.35); opacity:0 }
      100%{ transform:scale(1.35); opacity:0 }
    }

    /* Accesibilidad: respetar “reducir movimiento” */
    @media (prefers-reduced-motion: reduce){
      .icon svg{ animation:none !important }
      .icon svg .pulse{ animation:none !important; opacity:.2 }
    }
    /* Portal language menu */
    .lang{
      position:fixed; top:calc(12px + env(safe-area-inset-top)); right:calc(12px + env(safe-area-inset-right));
      display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:0 10px;
      font-size:12px; color:var(--muted); background:var(--card);
      border:1px solid var(--ring); border-radius:999px;
    }
    .lang[hidden]{ display:none }
    .lang .globe{ width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8 }
    .lang select{
      -webkit-appearance:none; appearance:none; min-height:32px; padding:0; border:0;
      background:transparent; color:inherit; font:inherit; cursor:pointer;
    }
    .lang select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
    .lang select option{ color:#000 }
  </style>
</head>
<body>
  <label class="lang" id="lang-wrap">
    <svg class="globe" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path d="M3 12h18" />
      <path d="M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9s1.3-6.3 3.8-9z" />
    </svg>
    <select id="lang-select" data-i18n-aria-label="lang_menu_label" aria-label="Language"></select>
  </label>
  <main class="card" role="status" aria-live="polite">
    <!-- Ícono SVG con check + pulso -->
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--accent2)"/>
            <stop offset="100%" stop-color="var(--accent)"/>
          </linearGradient>
        </defs>

        <!-- Aro que pulsa (solo trazo) -->
        <circle class="pulse" cx="32" cy="32" r="23" fill="none" stroke="url(#g)" stroke-width="4" />

        <!-- Disco de fondo -->
        <circle class="disc" cx="32" cy="32" r="22" fill="url(#g)"/>

        <!-- Check redondeado -->
        <path d="M22.5 33.5 L29 40.2 L43 24.8"
              fill="none" stroke="#fff" stroke-width="4.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 data-i18n="success_title">Credentials saved</h1>
    <p class="muted" data-i18n="success_restart">The device will restart to connect to your Wi-Fi.</p>
    <p class="small" data-i18n="success_hint">If it doesn't show up on your network afterwards, check the password or move the device closer to the router.</p>
  </main>
  <script type="application/json" id="i18n">
{
  "en": {
    "_name": "English",
    "lang_menu_label": "Language",
    "success_title": "Credentials saved",
    "success_restart": "The device will restart to connect to your Wi-Fi.",
    "success_hint": "If it doesn't show up on your network afterwards, check the password or move the device closer to the router."
  },
  "es": {
    "_name": "Español",
    "lang_menu_label": "Idioma",
    "success_title": "Credenciales guardadas",
    "success_restart": "El dispositivo se reiniciará para conectarse a tu Wi-Fi.",
    "success_hint": "Si luego no aparece en tu red, revisá la contraseña o acercá el equipo al router."
  },
  "de": {
    "_name": "Deutsch",
    "lang_menu_label": "Sprache",
    "success_title": "Zugangsdaten gespeichert",
    "success_restart": "Das Gerät startet neu, um sich mit deinem WLAN zu verbinden.",
    "success_hint": "Falls es danach nicht in deinem Netzwerk erscheint, prüfe das Passwort oder stelle das Gerät näher an den Router."
  }
}
  </script>
  <script>
    /* i18n-core:begin */
    // Shared portal i18n helpers. This block is identical in index.html,
    // success.html and error.html; tools/check_i18n.py enforces that.
    var AWMI18n = (function () {
      'use strict';
      var has = function (obj, key) { return Object.prototype.hasOwnProperty.call(obj, key); };

      // "de-CH" -> "de", "EN_us" -> "en"
      function primary(tag) {
        return String(tag || '').trim().toLowerCase().split(/[-_]/)[0];
      }

      // First browser language the portal supports, otherwise English.
      function pickBrowser(supported, browserLangs) {
        var list = browserLangs || [];
        for (var i = 0; i < list.length; i++) {
          var code = primary(list[i]);
          if (supported.indexOf(code) !== -1) return code;
        }
        return supported.indexOf('en') !== -1 ? 'en' : supported[0];
      }

      // Order: ?lang (when allowed), then the configured language, then AUTO.
      function resolve(o) {
        var url = primary(o.urlLang);
        if (o.urlAllowed && url && o.supported.indexOf(url) !== -1) return url;
        var configured = primary(o.configured);
        if (configured && configured !== 'auto' && o.supported.indexOf(configured) !== -1) return configured;
        return pickBrowser(o.supported, o.browserLangs);
      }

      function format(text, vars) {
        return String(text).replace(/\{(\w+)\}/g, function (match, name) {
          return vars && has(vars, name) ? String(vars[name]) : match;
        });
      }

      // Current language, then English, then the key itself. Never blank.
      function lookup(tables, lang, key) {
        if (tables[lang] && has(tables[lang], key)) return tables[lang][key];
        if (tables.en && has(tables.en, key)) return tables.en[key];
        return key;
      }

      function browserLangs(nav) {
        if (!nav) return [];
        if (nav.languages && nav.languages.length) return Array.prototype.slice.call(nav.languages);
        return nav.language ? [nav.language] : [];
      }

      // data-i18n-html uses innerHTML: only our own table text and escaped vars go there.
      function apply(doc, tables, lang, vars) {
        var text = function (key) { return format(lookup(tables, lang, key), vars); };
        doc.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = text(el.getAttribute('data-i18n'));
        });
        doc.querySelectorAll('[data-i18n-html]').forEach(function (el) {
          el.innerHTML = text(el.getAttribute('data-i18n-html'));
        });
        [['data-i18n-placeholder', 'placeholder'], ['data-i18n-title', 'title'],
         ['data-i18n-aria-label', 'aria-label']].forEach(function (pair) {
          doc.querySelectorAll('[' + pair[0] + ']').forEach(function (el) {
            el.setAttribute(pair[1], text(el.getAttribute(pair[0])));
          });
        });
        doc.documentElement.lang = lang;
      }

      // One option per table, in table order, labelled with the language's own name.
      function fillSelect(select, tables, lang) {
        select.textContent = '';
        Object.keys(tables).forEach(function (code) {
          var option = select.ownerDocument.createElement('option');
          option.value = code;
          option.lang = code;
          option.textContent = (tables[code] && tables[code]._name) || code;
          option.selected = code === lang;
          select.appendChild(option);
        });
      }

      return {
        primary: primary, pickBrowser: pickBrowser, resolve: resolve, format: format,
        lookup: lookup, browserLangs: browserLangs, apply: apply, fillSelect: fillSelect
      };
    })();
    /* i18n-core:end */
  </script>
  <script>
    (function () {
      // Language and menu state arrive in the URL (/save?lang=xx&switcher=0|1),
      // because the device is restarting and can't answer /info.
      const I18N = JSON.parse(document.getElementById('i18n').textContent);
      const params = new URLSearchParams(location.search);
      const select = document.getElementById('lang-select');
      function show(lang) {
        AWMI18n.apply(document, I18N, lang, {});
        AWMI18n.fillSelect(select, I18N, lang);
      }
      document.getElementById('lang-wrap').hidden = params.get('switcher') === '0';
      select.addEventListener('change', () => show(select.value));
      show(AWMI18n.resolve({
        supported: Object.keys(I18N),
        urlLang: params.get('lang'),
        urlAllowed: true,
        configured: null,
        browserLangs: AWMI18n.browserLangs(navigator)
      }));
    })();
  </script>
</body>
</html>
