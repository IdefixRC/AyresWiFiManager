name: PlatformIO CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  portal-assets:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Verify embedded portal assets
      run: python tools/check_portal_assets.py

    - name: Verify portal translations
      run: python tools/check_i18n.py

    - name: Test portal tooling
      run: |
        python -m pip install pytest
        python -m pytest tools/tests -q
        node --test tools/tests/i18n_core.test.mjs

    - name: Test time helpers (host C++)
      run: |
        g++ -std=gnu++17 -Wall -Wextra -Werror tools/tests/test_http_date.cpp -o "$RUNNER_TEMP/test_http_date"
        "$RUNNER_TEMP/test_http_date"

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core:
          # Registry espressif32: Arduino-ESP32 core 2.x (ESP-IDF v4).
          - name: core2
            platform: espressif32
          # pioarduino: Arduino-ESP32 core 3.3.11 (ESP-IDF v5).
          - name: core3
            platform: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
        example:
          - examples/Arduino/example.ino
          - examples/PlatformIO/main.cpp

    name: build (${{ matrix.core.name }}, ${{ matrix.example }})

    steps:
    - uses: actions/checkout@v7

    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ matrix.core.name }}-${{ hashFiles('library.json') }}
        restore-keys: |
          ${{ runner.os }}-platformio-${{ matrix.core.name }}-

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: .github/workflows/ci.yml

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Build ${{ matrix.example }}
      run: >
        pio ci ${{ matrix.example }}
        --lib=.
        --board=esp32dev
        --project-option="platform=${{ matrix.core.platform }}"
